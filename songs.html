<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PIKA-PIKA ROCKUMBION - Canciones</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #ffde59,
        #ffb300,
        #ff6f00
    );
    margin:0;
    padding:10px;
}

h1{
    text-align:center;
}

#search{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    font-size:16px;
    box-sizing:border-box;
}

.table-container{
    overflow-x:auto;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#7b1fa2;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:8px;
}

tr:nth-child(even){
    background:#f8f8f8;
}

tr:hover{
    background:#fff8d6;
}

.action-link{
    text-decoration:none;
    color:white;
    background:#7b1fa2;
    padding:5px 8px;
    border-radius:6px;
    font-size:12px;
    display:inline-block;
}

.action-link:hover{
    background:#ff6600;
}

.song-link{
    text-decoration:none;
    color:#7b1fa2;
    font-weight:bold;
}

.song-link:hover{
    color:#ff6600;
}

</style>
</head>

<body>

<h1>🎸 PIKA-PIKA ROCKUMBION - Canciones</h1>

<input
    type="text"
    id="search"
    placeholder="Search songs..."
>

<div class="table-container">

<table>

<thead>
<tr>
<th>#</th>
<th>Song</th>
<th>Key</th>
<th>Genre</th>
<th>Artist</th>
<th>Language</th>
<th>Suggested By</th>
<th>Notes</th>
<th>🎵 Recording</th>
<th>📺 Video</th>
<th>📄 Lyrics</th>
</tr>
</thead>

<tbody id="songsBody">
</tbody>

</table>

</div>

<script>

let allRows = [];

fetch('songs.csv')
.then(function(response){
    return response.text();
})
.then(function(text){

    const rows = text.trim().split('\n');

    allRows = rows.slice(1).map(function(row){
        return row.split(',');
    });

    renderTable(allRows);

})
.catch(function(error){

    console.error(error);

    document.getElementById('songsBody').innerHTML =
        '<tr><td colspan="9">Unable to load songs.csv</td></tr>';

});

function renderTable(rows){

    const tbody = document.getElementById('songsBody');

    tbody.innerHTML = '';

    rows.forEach(function(cols){

        const tr = document.createElement('tr');

        var recording = '';
        var video = '';
        var lyrics = '';

        if(cols[8] && cols[8].indexOf('http') === 0){
            recording =
                '<a href="' +
                cols[8] +
                '" target="_blank" class="action-link">🎵 Recording</a>';
        }

        if(cols[9] && cols[9].indexOf('http') === 0){
            video =
                '<a href="' +
                cols[9] +
                '" target="_blank" class="action-link">📺 Video</a>';
        }

        if(cols[10] && cols[10].indexOf('http') === 0){
            lyrics =
                '<a href="' +
                cols[10] +
                '" target="_blank" class="action-link">📄 Lyrics</a>';
        }

        tr.innerHTML =
            '<td>' + (cols[0] || '') + '</td>' +
            '<td>' + (cols[1] || '') + '</td>' +
            '<td>' + (cols[2] || '') + '</td>' +
            '<td>' + (cols[3] || '') + '</td>' +
            '<td>' + (cols[4] || '') + '</td>' +
            '<td>' + (cols[5] || '') + '</td>' +
            '<td>' + (cols[6] || '') + '</td>' +
            '<td>' + (cols[7] || '') + '</td>' +
            '<td>' + recording + '</td>' +
            '<td>' + video + '</td>' +
            '<td>' + lyrics + '</td>'
             ;

        tbody.appendChild(tr);

    });

}

document.getElementById('search').addEventListener('input', function(){

    var search = this.value.toLowerCase();

    var filtered = allRows.filter(function(row){

        return row.join(' ')
                  .toLowerCase()
                  .indexOf(search) > -1;

    });

    renderTable(filtered);

});

</script>

</body>

</html>
