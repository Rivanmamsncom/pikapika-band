<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PIKA-PIKA ROCKUMBIO Song Catalog</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f1f5f9;
}

h1{
    text-align:center;
}

#search{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    font-size:16px;
    box-sizing:border-box;
}

.table-container{
    overflow-x:auto;
    background:white;
    border:1px solid #ddd;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1400px;
}

th{
    background:#1e1e1e;
    color:white;
    padding:10px;
    position:sticky;
    top:0;
}

td{
    border:1px solid #ddd;
    padding:8px;
    white-space:nowrap;
}

tr:nth-child(even){
    background:#f8f8f8;
}

</style>
</head>

<body>

<h1>🎸 PikaFlower Song Catalog</h1>

<input type="text" id="search" placeholder="Search songs...">

<div class="table-container">

<table>

<thead>
<tr>
<th>#</th>
<th>Song</th>
<th>Key</th>
<th>Genre</th>
<th>Artist</th>
<th>Language</th>
<th>Suggested By</th>
<th>Notes</th>
<th>Recording Link</th>
<th>Video Link</th>
<th>Lyrics Link</th>
<th>Votes</th>
</tr>
</thead>

<tbody id="songsBody">
</tbody>

</table>

</div>

<script>

let allRows = [];

fetch('songs.csv')
.then(response => response.text())
.then(text => {

    const rows = text.trim().split('\n');

    allRows = rows.slice(1).map(row => row.split(','));

    renderTable(allRows);

})
.catch(error => {
    console.error(error);
    document.getElementById('songsBody').innerHTML =
        '<tr><td colspan="12">Unable to load songs.csv</td></tr>';
});

function renderTable(rows){

    const tbody = document.getElementById('songsBody');

    tbody.innerHTML = '';

    rows.forEach(cols => {

        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${cols[0] || ''}</td>
            <td>${cols[1] || ''}</td>
            <td>${cols[2] || ''}</td>
            <td>${cols[3] || ''}</td>
            <td>${cols[4] || ''}</td>
            <td>${cols[5] || ''}</td>
            <td>${cols[6] || ''}</td>
            <td>${cols[7] || ''}</td>
            <td>${cols[8] || ''}</td>
            <td>${cols[9] || ''}</td>
            <td>${cols[10] || ''}</td>
            <td>${cols[11] || ''}</td>
        `;

        tbody.appendChild(tr);

    });
}

document.getElementById('search').addEventListener('input', function(){

    const search = this.value.toLowerCase();

    const filtered = allRows.filter(row =>
        row.join(' ').toLowerCase().includes(search)
    );

    renderTable(filtered);

});

</script>

</body>
</html>
