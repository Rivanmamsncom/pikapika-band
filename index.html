    );
    margin:0;
    padding:10px;
}

h1{
    text-align:center;
}

#search{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    font-size:16px;
    box-sizing:border-box;
}

.table-container{
    overflow-x:auto;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

table{
    width:100%;

th{

tr:nth-child(even){

}

.action-link{
