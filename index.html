<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PIKA-PIKA ROCKUMBION - Canciones</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #ffde59,
        #ffb300,
        #ff6f00
    );
    margin:0;
    padding:10px;
}

h1{
    text-align:center;
}

#search{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    font-size:16px;
    box-sizing:border-box;
}

.table-container{
    overflow-x:auto;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#7b1fa2;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:8px;
}

tr:nth-child(even){
    background:#f8f8f8;
}

tr:hover{
    background:#fff8d6;
}

.action-link{
    text-decoration:none;
    color:white;
    background:#7b1fa2;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    display:inline-block;
}

.action-link:hover{
    background:#ff6600;
}

.song-link{
    text-decoration:none;
    color:#7b1fa2;
    font-weight:bold;
}

.song-link:hover{
    color:#ff6600;
}

</style>
</head>

<body>

<h1>🎸 PIKA-PIKA ROCKUMBION - Canciones</h1>

<input
    type="text"
    id="search"
    placeholder="Search songs..."
>

<div class="table-container">

<table>

<thead>
<tr>
<th>#</th>
<th>Song</th>
<th>Key</th>
<th>Genre</th>
<th>Artist</th>
<th>Suggested By</th>
<th>🎵 Recording</th>
<th>📺 Video</th>
<th>📄 Lyrics</th>
</tr>
</thead>

<tbody id="songsBody">
</tbody>

</table>

</div>

<script>

let allRows = [];

fetch('songs.csv')
.then(response => response.text())
.then(text => {

    const rows = text.trim().split('\n');

    allRows = rows.slice(1).map(row => row.split(','));
    console.log(allRows[0]);
console.log(allRows[1]);
console.log(allRows[2]);
    

    renderTable(allRows);

})
.catch(error => {

    console.error(error);

    document.getElementById('songsBody').innerHTML =
        '<tr><td colspan="9">Unable to load songs.csv</td></tr>';

});

function renderTable(rows){

    const tbody = document.getElementById('songsBody');

    tbody.innerHTML = '';

    rows.forEach(cols => {

        const tr = document.createElement('tr');

        let recording = '';
        let video = '';
        let lyrics = '';

if(cols[8] && cols[8].startsWith('http')){
    recording =
    `<a href="${cols    🎵 Recording
    </a>`;
}

if(cols[9] && cols[9].startsWith('http')){
    video =
    `<a href="${cols[9]}"
           </a>`;
}

        if(cols[10] && cols[10].startsWith('http')){
            lyrics =
            `${cols[10]}
                📄 Lyrics
            </a>`;
        }

        let songDisplay = cols[1] || '';

        tr.innerHTML = `
            <td>${cols[0] || ''}</td>
            <td>${songDisplay}</td>
            <td>${cols[2] || ''}</td>
            <td>${cols[3] || ''}</td>
            <td>${cols[4] || ''}</td>
            <td>${cols[6] || ''}</td>
            <td>${recording}</td>
            <td>${video}</td>
            <td>${lyrics}</td>
        `;

        tbody.appendChild(tr);

    });

}

document.getElementById('search').addEventListener('input', function(){

    const search = this.value.toLowerCase();

    const filtered = allRows.filter(row =>
        row.join(' ').toLowerCase().includes(search)
    );

    renderTable(filtered);

});

</script>

</body>
</html>
