<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PIKA-PIKA ROCKUMBION - Calendar</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(
        135deg,
        #ffde59,
        #ffb300,
        #ff6f00
    );

    margin:0;
    padding:20px;
}

.home-button{

    display:inline-block;

    text-decoration:none;

    color:white;

    background:#7b1fa2;

    padding:10px 20px;

    border-radius:8px;

    font-weight:bold;

    margin-bottom:20px;
}

.home-button:hover{
    background:#ff6600;
}

h1{
    text-align:center;
}

#monthTitle{
        text-align:center;

    margin-bottom:30px;

    font-size:2rem;

    font-weight:bold;
}
    .calendar-header{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    margin-bottom:20px;

}

.calendar-header button{

    padding:10px 15px;

    border:none;

    border-radius:8px;

    background:#7b1fa2;

    color:white;

    cursor:pointer;

    font-weight:bold;

}



.weekdays{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:10px;

    margin-bottom:10px;

    font-weight:bold;

    text-align:center;

}

.calendar{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:10px;

}

.day-card{

    background:white;

    border-radius:10px;

    min-height:130px;

    padding:10px;

    color:black;

    box-shadow:
        0 2px 8px rgba(0,0,0,.15);

    cursor:pointer;

    transition:.3s;

}

.day-card:hover{

    transform:translateY(-5px);

}

.date{

    font-size:1.5rem;

    font-weight:bold;

    margin-bottom:10px;
}
    .day{

    font-size:.85rem;

    color:#444;

}

.event-type{

    font-size:.80rem;

    font-weight:bold;

    color:#7b1fa2;

    margin-top:8px;

}

.event-name{

    font-size:.95rem;

    font-weight:bold;

    margin-bottom:8px;

}

.calendar-wrapper{

    overflow-x:auto;

}

.weekdays,
.calendar{

    min-width:900px;

}

@media(max-width:768px){

    .weekdays,
    .calendar{

        min-width:700px;

    }

}

.green{

    background:#d4edda;

    border:2px solid #28a745;

}

.orange{

    background:#fff3cd;

    border:2px solid #ffc107;

}

.red{

    background:#f8d7da;

    border:2px solid #dc3545;

}

.gray{

    background:#f0f0f0;

    border:2px solid #888;

}

.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.7);

}

.modal-content{

    background:white;

    width:90%;

    max-width:600px;

    margin:50px auto;

    padding:25px;

    border-radius:12px;

    color:black;

}

.close{

    float:right;

    cursor:pointer;

    font-size:28px;

    font-weight:bold;

}
    

</style>

</head>

<body>

<a href="index.html" class="home-button">
🏠 HOME
</a>

<a href="songs.html" class="home-button">
🎵 SONG LIST
</a>

<h1>📅 ROCKUMBION CALENDAR</h1>

<div class="calendar-header">

    <button onclick="previousMonth()">
        ◀
    </button>

    <div id="monthTitle"></div>

    <button onclick="nextMonth()">
        ▶
    </button>

</div>

<div class="calendar-wrapper">

    <div class="weekdays">

        <div>SUN</div>
        <div>MON</div>
        <div>TUE</div>
        <div>WED</div>
        <div>THU</div>
        <div>FRI</div>
        <div>SAT</div>

    </div>

    <div id="calendar" class="calendar"></div>

</div>

<div id="modal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">
            ×
        </span>

        <div id="modalContent"></div>

    </div>

</div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
<script>

const SUPABASE_URL =
"https://nkbuswwxvcsbwfpfvena.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rGy22khfvjVl7fHx2OnePg_ngX4lR23";

const client =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentDate =
new Date();

let allEvents = [];

async function loadEvents(){

    const { data, error } =
        await client
            .from('events')
            .select('*');

    if(error){

        console.error(error);
        return;

    }

    allEvents = data || [];

    renderCalendar();

}

function renderCalendar(){

    const calendar =
        document.getElementById(
            "calendar"
        );

    calendar.innerHTML = "";

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    document.getElementById(
        "monthTitle"
    ).innerHTML =

        currentDate.toLocaleString(
            "default",
            {
                month:"long",
                year:"numeric"
            }
        );

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();

    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    for(
        let i = 0;
        i < firstDay;
        i++
    ){

        const blank =
            document.createElement(
                "div"
            );

        blank.className =
            "day-card";

        blank.style.visibility =
            "hidden";

        calendar.appendChild(
            blank
        );

    }

    for(
        let day = 1;
        day <= daysInMonth;
        day++
    ){

        const dateString =
            `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        const event =
            allEvents.find(
                e =>
                e.event_date ===
                dateString
            );

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "day-card";

        let content =

            `<div class="date">${day}</div>`;

        if(event){

            content +=

            `<div class="event-type">
                ${event.title}
            </div>

            <div class="event-name">
                ${event.location}
            </div>`;

        }

        card.innerHTML =
            content;

        card.onclick =
            () =>
            openModal(
                event,
                dateString
            );

        calendar.appendChild(
            card
        );

    }

}

function openModal(
    event,
    dateString
){

    document.getElementById(
        "modal"
    ).style.display =
    "block";

    if(event){

    loadAvailability(event.id);

    document.getElementById(
        "modalContent"
    ).innerHTML =

    `
    <h2>${event.title}</h2>

    <p>
    📍 ${event.location}
    </p>

    <p>
    📅 ${event.event_date}
    </p>

    <p>
    🕒 ${event.event_time}
    </p>

    <p>
    ${event.notes || ""}
    </p>

    <hr>

    <h3>Your Availability</h3>

    <select
        id="memberSelect"
        style="width:100%;padding:10px;margin-bottom:10px;">
    </select>

    <select
        id="statusSelect"
        style="width:100%;padding:10px;margin-bottom:15px;">

        <option value="Available">
            ✅ Available
        </option>

        <option value="Maybe">
            🟠 Maybe
        </option>

        <option value="Not Available">
            ❌ Not Available
        </option>

    </select>

    <button
        onclick="saveAvailability('${event.id}')">

        Save Availability

    </button>

    <hr>

    <div id="availabilityList">

        Loading...

    </div>
    `;

    loadMembers();

}
    else{

    document.getElementById(
        "modalContent"
    ).innerHTML =

    `
    <h2>Create Event</h2>

    <p>Date: ${dateString}</p>

    <input
        id="newTitle"
        placeholder="Event Title"
        style="width:100%;padding:10px;margin-bottom:10px;">

    <input
        id="newLocation"
        placeholder="Location"
        style="width:100%;padding:10px;margin-bottom:10px;">

    <input
        id="newTime"
        type="time"
        style="width:100%;padding:10px;margin-bottom:10px;">

    <textarea
        id="newNotes"
        placeholder="Notes"
        style="width:100%;padding:10px;height:100px;">
    </textarea>

    <br><br>

    <button
        onclick="saveEvent('${dateString}')">
        Save Event
    </button>
    `;

}
}

function closeModal(){

    document.getElementById(
        "modal"
    ).style.display =
    "none";

}
async function saveEvent(dateString){

    const title =
        document.getElementById(
            "newTitle"
        ).value;

    const location =
        document.getElementById(
            "newLocation"
        ).value;

    const time =
        document.getElementById(
            "newTime"
        ).value;

    const notes =
        document.getElementById(
            "newNotes"
        ).value;

    const { error } =
        await client
            .from("events")
            .insert([
            {
                title: title,
                location: location,
                event_date: dateString,
                event_time: time,
                notes: notes
            }
        ]);

    if(error){

        alert(
            "Error saving event"
        );

        console.error(error);

        return;

    }

    closeModal();

    await loadEvents();

}
function nextMonth(){

    currentDate.setMonth(
        currentDate.getMonth() + 1
    );

    renderCalendar();

}

function previousMonth(){

    currentDate.setMonth(
        currentDate.getMonth() - 1
    );

    renderCalendar();

}
async function loadMembers(){

    const { data, error } =
        await client
            .from("members")
            .select("*")
            .order("name");

    if(error){

        console.error(error);
        return;

    }

    const dropdown =
        document.getElementById(
            "memberSelect"
        );

    dropdown.innerHTML = "";

    data.forEach(member => {

        dropdown.innerHTML +=

        `
        <option value="${member.name}">
            ${member.name}
        </option>
        `;

    });

}
    async function loadAvailability(eventId){
 
console.log(
"Loading availability for",
eventId
);
 
}
 
loadEvents();


</script>
</body>

</html>
